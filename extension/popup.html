<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                width: 320px;
            }
        </style>
    </head>
    <body>
        <main>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required />
                <input type="password" id="password" placeholder="密碼" required />
                <button type="submit">登入</button>
                <p id="login-status"></p>
            </form>
            <section id="app-panel" hidden>
                <p>已登入：<span id="user-email"></span></p>
                <button id="btn-logout" type="button">登出</button>

                <h1>Collect Ads</h1>
                <p id="ad-id">讀取中…</p>
                <button id="btn-collect">抓取選取文字</button>
                <textarea id="ad-copy" rows="6"></textarea>
            </section>
        </main>
        <script type="module" src="popup.js"></script>
    </body>
</html>
