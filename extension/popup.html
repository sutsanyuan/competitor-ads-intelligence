<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                width: 320px;
            }
        </style>
    </head>
    <body>
        <main>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required />
                <input type="password" id="password" placeholder="密碼" required />
                <button type="submit">登入</button>
                <p id="login-status"></p>
            </form>
            <section id="app-panel" hidden>
                <p>已登入：<span id="user-email"></span></p>
                <button id="btn-logout" type="button">登出</button>

                <h1>Collect Ads</h1>
                <form id="ad-form">
                    <label>廣告編號 <input id="ad-id" required /></label>
                    <label>品牌 <input id="competitor" required /></label>
                    <label>標題 <input id="headline" required /></label>
                    <button type="button" id="btn-collect">抓取選取文字</button>
                    <label>文案 <textarea id="ad-copy" rows="6" required></textarea></label>
                    <label>開始日期 <input type="date" id="started-at" required /></label>
                    <button type="submit">儲存廣告</button>
                    <p id="save-status"></p>
                </form>
            </section>
        </main>
        <script type="module" src="popup.js"></script>
    </body>
</html>
